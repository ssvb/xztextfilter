name: LZMA2 lc=3,lp=0,pb=2

on:
  push:
    branches: [ "main", "remapfilter_v2" ]
  workflow_dispatch: # Allows manual triggering from the UI

jobs:
  optimize-remap-302:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y liblzma-dev gcc

      - name: Compile Optimizer
        run: |
          gcc -O3 -o lzma_remap_sa_multi lzma_remap_sa_multi.c -llzma -lm

      - name: Run Simulated Annealing (5 Hours)
        run: |
          ./lzma_remap_sa_multi --lc=3 --lp=0 --pb=2 --normalize --seedfile=texteng.seed --swaps=128 --stagnation=3000 --timeout=20000 small/texteng.txt small/texteng.html
