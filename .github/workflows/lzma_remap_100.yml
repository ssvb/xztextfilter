name: LZMA Stochastic Optimization

on:
  push:
    branches: [ "main", "remapfilter_v2" ]
  workflow_dispatch: # Allows manual triggering from the UI

jobs:
  optimize-remap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y liblzma-dev gcc

      - name: Compile Optimizer
        run: |
          gcc -O3 -o lzma_remap_sa_multi lzma_remap_sa_multi.c -llzma -lm

      - name: Run Simulated Annealing (5 Hours)
        run: |
          # The C program takes the timeout in seconds.
          # 5 hours = 18000 seconds. Setting to 17900 to ensure graceful C exit
          # before the GitHub Actions runner forcibly terminates the container.
          ./lzma_remap_sa_multi --lc=1 --lp=0 --pb=0 --heuristic=256 --timeout=17900 /usr/bin/sed /usr/include/math.h bash.mo pg68283.txt pg2701.txt
