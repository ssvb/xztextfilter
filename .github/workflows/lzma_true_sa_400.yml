name: LZMA2 lc=4,lp=0,pb=0

on:
  push:
    branches: [ "main", "remapfilter_v2" ]
  workflow_dispatch: # Allows manual triggering from the UI

jobs:
  find-new-sa-400:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y liblzma-dev gcc

      - name: Compile Optimizer
        run: |
          gcc -O3 -o true_sa true_sa.c -llzma -lm

      - name: Run Simulated Annealing (~5.5 Hours)
        run: |
          ./true_sa --lc=4 --lp=0 --pb=0 --tstart=50 --timeout=20000 small/texteng.txt small/texteng.html
